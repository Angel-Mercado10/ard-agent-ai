version: 2
project_name: ard-agent-ai

builds:
  - id: ard-agent-ai
    main: ./cmd/ard-agent-ai
    binary: ard-agent-ai
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

release:
  github:
    owner: Angel-Mercado10
    name: ard-agent-ai
